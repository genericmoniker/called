<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Missionaries</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon" />
    <link href="{% static 'board/static/board.css' %}" rel="stylesheet">
    <script src="{% static 'board/static/board.js' %}" defer></script>
    <script src="{% static 'board/static/cursor.js' %}"></script>
    {% if next_url %}
    <meta http-equiv="refresh" content="30; url={{ next_url }}">
    {% endif %}
    {% block styles %}{% endblock %}
</head>


<body id="body" class="fadein" data-next-url="{{ next_url|default:''|escape }}">
    <!-- Offline indicator -->
    <div id="offline-indicator" class="offline-indicator" role="status" aria-live="polite">
        <svg class="offline-indicator__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2 8.5a17 17 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M5 12a12 12 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8.5 15.5a7 7 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="19" r="1.8" fill="currentColor"/>
            <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
    </div>

    <section class="section">
        {% block content %}{% endblock %}
    </section>
</body>
</html>
