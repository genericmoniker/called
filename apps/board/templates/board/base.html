<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Missionaries</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon" />
    <link href="{% static 'board/static/board.css' %}" rel="stylesheet">
    <script src="{% static 'board/static/board.js' %}" defer></script>
    <script src="{% static 'board/static/cursor.js' %}"></script>
    {% if next_url %}
    <meta http-equiv="refresh" content="30; url={{ next_url }}">
    {% endif %}
    {% block styles %}{% endblock %}
</head>


<body id="body" class="fadein hide-cursor" data-next-url="{{ next_url|default:''|escape }}">
    <!-- Offline indicator -->
    <div id="cache-indicator" class="cache-indicator" role="status" aria-live="polite">
        <img class="cache-indicator__icon" src="{% static 'img/cloud-xmark.svg' %}" alt="" aria-hidden="true">
    </div>

    <section class="section">
        {% block content %}{% endblock %}
    </section>
</body>
</html>
