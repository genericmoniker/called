{% extends "board/base.html" %}

{% load static %}

{% block styles %}
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .section {
        padding: 0;
        height: 100vh;
    }

    .empty-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        padding: 0;
    }

    .hero {
        position: relative;
        width: 100%;
        height: 100vh;
        background-image: url('{% static "board/static/hong_kong_sister_missionaries_subway.jpg" %}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
    }

    .hero-content {
        position: relative;
        z-index: 1;
        text-align: center;
        color: white;
        padding: 2rem;
        max-width: 1200px;
    }

    .hero-content h1 {
        font-size: 8rem;
        font-weight: bold;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .hero-content p {
        font-size: 3rem;
        margin-bottom: 0;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.7);
    }
</style>
{% endblock %}

{% block content %}
<div class="empty-container">
  <div class="hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
          <h1>Missionary Board</h1>
          <p>No missionaries have been added yet.</p>
      </div>
  </div>
</div>
{% endblock %}
